<h1>PHILIPPINE PESO TO?:</h1>
<br>

<center>
<script>
	
	let php = 100; //given value in peso

document.write("<h2>Let us convert</h2>" + "<kbd>" + php + "</kbd>" + "<h2>to the following currencies</h2>");
	
</script>

<p id="display"></p>
<center>
<button type="button" class="btn btn-success" onclick="let php = 100; let dollar = 58.66; document.getElementById('display').innerHTML= '<kbd>' + php/dollar + '</kbd>';">Dollar</button> 

<button type="button" class="btn btn-success" onclick="let php = 100; let yen = 0.37; document.getElementById('display').innerHTML= '<kbd>' + php*yen + '</kbd>';">Yen</button>
